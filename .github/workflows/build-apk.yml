name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # The project uses compileSdk 36.1 (Android 16 QPR2).
      # GitHub runners do not always have this extension SDK installed.
      - name: Install Android SDK 36.1
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Verify build tools
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | grep -E 'platforms;android-36\.1|build-tools;36\.0\.0' || true

      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmallStore-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
